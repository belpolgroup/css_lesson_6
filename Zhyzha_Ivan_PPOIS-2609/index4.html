
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВКонтакте.ру | Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="registration">
        <h1>Регистрация</h1>

        <div class="project-info">
            <img src="Vkontakte.gif"
                 width="32"
                 height="32"
                 alt="Логотип ВКонтакте">

            <p>
                <strong>ВКонтакте.ру</strong> - сетевой проект,
                который поможет Вам узнать больше о людях,
                которые Вас окружают, а также найти
                потерянных друзей и поддерживать с ними связь.
                Вы сможете делиться информацией, ограничивая
                круг лиц, которым она будет доступна.
            </p>
        </div>

        <form class="registration-form">
            <section class="form-section"
                     aria-labelledby="personal-heading">

                <h2 id="personal-heading">Имя</h2>

                <div class="form-row">
                    <label for="first-name">Имя:</label>
                    <input type="text"
                           id="first-name"
                           name="first_name">
                </div>

                <div class="form-row">
                    <label for="last-name">Фамилия:</label>
                    <input type="text"
                           id="last-name"
                           name="last_name">
                </div>

                <div class="form-row">
                    <label for="email">E-Mail:</label>
                    <input type="email"
                           id="email"
                           name="email">
                </div>

                <div class="form-row">
                    <label for="password">Пароль:</label>
                    <input type="password"
                           id="password"
                           name="password">
                </div>
            </section>
        </form>
    </main>
</body>
</html>
